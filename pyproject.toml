[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfls-core"
version = "0.1.0"
description = "Neural-Formal Logic Synthesis: natural-language intent to Z3-verified executable code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mmunki" }]
keywords = ["z3", "smt", "formal-verification", "code-generation", "nfls"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["z3-solver>=4.12,<5"]

[project.scripts]
nfls = "nfls.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["nfls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
